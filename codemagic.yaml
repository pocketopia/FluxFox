workflows:
  ios-workflow:
    name: FluxFox Production Final
    instance_type: mac_mini_m4
    working_directory: mobile
    max_build_duration: 60
    integrations:
      app_store_connect: CodeMagic
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      groups:
        - AppStore
      vars:
        BUNDLE_ID: "com.fluxfox.app"
        XCODE_SCHEME: "FluxFox"
        # Live production web app the mobile WebView loads (read by
        # mobile/App.tsx at Expo build time).
        EXPO_PUBLIC_WEBAPP_URL: "https://fluxfox-web.vercel.app"
        # Numeric Apple ID of the app in App Store Connect (App Information ->
        # General -> Apple ID). Put it in the `AppStore` group as
        # APP_STORE_APPLE_ID so build numbers continue from TestFlight's latest.
    scripts:
      - name: Install Dependencies
        script: npm install
      - name: Set Next Build Number
        script: |
          # TestFlight rejects any upload whose buildNumber was already used, so
          # never ship the static "1" from app.json. Use the higher of:
          #   (a) latest TestFlight build number + 1 (needs APP_STORE_APPLE_ID)
          #   (b) Codemagic's monotonic $PROJECT_BUILD_NUMBER
          LATEST=0
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1 | tr -dc '0-9')
            LATEST=${LATEST:-0}
          else
            echo "APP_STORE_APPLE_ID is not set; falling back to PROJECT_BUILD_NUMBER only."
          fi
          NEXT=$((LATEST + 1))
          # Safe floor: PROJECT_BUILD_NUMBER + 10 always clears earlier manual
          # uploads (build 1, 2, ...). Take the higher of the two values.
          FLOOR=$((PROJECT_BUILD_NUMBER + 10))
          if [ "$FLOOR" -gt "$NEXT" ]; then NEXT=$FLOOR; fi
          echo "Using iOS buildNumber $NEXT (latest TestFlight: $LATEST, project build: $PROJECT_BUILD_NUMBER)"
          # Expo prebuild writes ios.buildNumber into CFBundleVersion /
          # CURRENT_PROJECT_VERSION, so set it in app.json BEFORE prebuild.
          BUILD_NUMBER="$NEXT" node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.ios=j.expo.ios||{};j.expo.ios.buildNumber=process.env.BUILD_NUMBER;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
      - name: Patch react-native-iap Podspec (legacy RN pods)
        script: |
          # RN 0.86+ (React-Core-prebuilt + ReactNativeDependencies) has no
          # standalone RCT-Folly / RCTRequired / RCTTypeSafety /
          # ReactCommon/turbomodule/core podspecs; strip them from RNIap.
          # (Also runs via the `postinstall` script; re-run here so it is
          # guaranteed and verified before CocoaPods resolves dependencies.)
          node scripts/patch-rniap-podspec.js
          if grep -E "dependency[[:space:]]*\(?[[:space:]]*['\"](RCT-Folly|RCTRequired|RCTTypeSafety|ReactCommon/turbomodule/core)['\"]" node_modules/react-native-iap/RNIap.podspec; then
            echo "A legacy pod dependency is still present in RNIap.podspec" >&2
            exit 1
          fi
          grep -E "dependency[[:space:]]*\(?[[:space:]]*['\"]React-Core['\"]" node_modules/react-native-iap/RNIap.podspec
      - name: Expo Prebuild
        # --no-install: only generate the native project. Expo must not run
        # `pod install` itself; the "Install CocoaPods" step below does that.
        script: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Fetch Signing Files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build and Package IPA
        script: |
          DETECTED_WORKSPACE=$(find . -name "*.xcworkspace" | grep -v "node_modules" | grep -v "xcodeproj" | head -n 1)
          xcode-project build-ipa \
            --workspace "$DETECTED_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CODE_SIGN_STYLE=Manual"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
